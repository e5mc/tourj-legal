<style>
:root{
  --ink:#2A2547;
  --ink-2:#5B5675;
  --lav:#6A50C8;
  --card-bg:#F7F5FB;
  --page:#ECE8F4;
  --line:#E2DCEE;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;
  background:var(--page);
  color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  line-height:1.55;
  word-break:keep-all;
  overflow-wrap:break-word;
  -webkit-font-smoothing:antialiased;
}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.wrap{width:100%;max-width:560px;margin:0 auto}

/* 카드 9장 */
.cards{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.cards li{background:var(--card-bg)}
.cards img{display:block;width:100%;height:auto;aspect-ratio:1080/1350}

/* 마지막 안내 */
.next{margin-top:10px;background:var(--white);padding:30px 20px 32px}
.eyebrow{margin:0 0 6px;font-size:14px;font-weight:700;color:var(--lav)}
.lead{margin:0 0 16px;font-size:17px;font-weight:600;line-height:1.5}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:54px;padding:0 18px;border-radius:14px;
  font-size:16px;font-weight:700;text-decoration:none;
  -webkit-tap-highlight-color:transparent;
  transition:background-color .15s ease,border-color .15s ease;
}
.btn svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn-primary{background:var(--ink);color:var(--white)}
.btn-primary:hover{background:#3A3462}
.btn-line{background:var(--white);color:var(--ink);border:1.5px solid var(--line)}
.btn-line:hover{border-color:#C9C0DD}
.btn:focus-visible,.foot a:focus-visible{outline:3px solid var(--lav);outline-offset:3px}
.stores{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.divider{height:1px;background:var(--line);margin:28px 0}
.small{margin:16px 0 0;font-size:15px;color:var(--ink-2)}

.foot{padding:28px 20px calc(36px + env(safe-area-inset-bottom));text-align:center}
.foot a{display:inline-flex;align-items:center;gap:8px;color:var(--ink-2);font-size:14px;font-weight:600;text-decoration:none;border-radius:8px}
.foot img{width:26px;height:26px;border-radius:7px}

@media (min-width:600px){
  .wrap{padding:36px 0 0}
  .cards{gap:20px}
  .cards li,.next{border-radius:24px;overflow:hidden;box-shadow:0 1px 2px rgba(42,37,71,.05),0 12px 32px rgba(42,37,71,.07)}

}

<main class="wrap">
<h1 class="sr-only">뚜르제이 루트마켓 얼리 크리에이터 초대장</h1>
<ol class="cards">
<li><img src="card-01.webp?v=20261012" width="1080" height="1350" fetchpriority="high" decoding="async" alt="1/9 얼리 크리에이터 초대장(오픈 전 초대). 다녀온 여행을 루트로 팔아 보세요. 얼리 크리에이터만 받는 조건과 꼭 알아야 할 계약 내용을 9장에 담았어요. 최대 6개월 인세 100%(기본 3개월 + 릴스 미션 3개월). 그 뒤 1년 보장 70%(독점 루트 기준, 일반 루트는 50%). 19,900원 루트 1건에 15,377원(100% 기간, 세금 떼기 전)."></li>
<li><img src="card-02.webp?v=20261012" width="1080" height="1350" decoding="async" alt="2/9 루트가 팔릴 때마다 인세가 쌓여요. 다녀온 여행, 루트로 등록, 뚜르제이가 판매, 판매마다 인세. 저작권은 그대로 크리에이터 것이에요. 뚜르제이는 이용 허락을 받아 판매하고, 팔릴 때마다 인세를 드려요. 판매가별 1건 인세(100% 기간 / 독점 70% / 일반 50%): 19,900원은 15,377원 / 10,763원 / 7,688원, 24,500원은 18,931원 / 13,251원 / 9,465원, 29,500원은 22,795원 / 15,956원 / 11,397원. 가격은 3단계 중 직접 고르고 판매 중에도 바꿀 수 있어요. 독점 70%는 100% 기간 뒤 1년 보장, 독점이 아니면 50%예요. 금액은 부가세와 앱마켓 수수료(15%)를 뺀 순수입 기준, 세금 떼기 전이에요."></li>
<li><img src="card-03.webp?v=20261012" width="1080" height="1350" loading="lazy" decoding="async" alt="3/9 인세는 이렇게 받아요. 100%: 오픈일부터 3개월, 릴스 미션을 채우면 6개월까지 100%예요. 70%: 그 뒤 1년, 뚜르제이에서만 파는 독점 루트는 1년 동안 7:3을 보장해요. 50%: 독점이 아닌 루트는 100% 기간이 끝나면 5:5예요. 보장 1년이 끝난 뒤에는 70%를 그대로 적용하고, 바꿀 때는 30일 전에 따로 알려 드려요. 예) 12월 1일 오픈, 릴스 미션 달성, 독점 루트라면 다음 해 5월 31일 결제분까지 100%, 6월 1일부터 1년 동안 결제분은 70%(보장). 100% 기간 안의 판매분은 루트 개수와 상관없이 모두 100%예요. 오픈 뒤에 합류하는 크리에이터는 처음부터 50%예요."></li>
<li><img src="card-04.webp?v=20261012" width="1080" height="1350" loading="lazy" decoding="async" alt="4/9 릴스 미션: 오픈 후 60일 안에 2개. 채우면 인세 100% 기간이 3개월에서 6개월로 늘어나요. 1 본인 인스타그램 공개 계정에 올리기. 2 15초 이상, 내 루트와 뚜르제이 앱 화면이 나오게(영상·사진·음악은 직접 만들었거나 쓸 권리가 있는 것만). 3 뚜르제이 공식 계정을 ‘공동 작업자’로 초대(수락하면 확인 끝, 뚜르제이 계정에도 함께 보여요). 4 캡션 첫 줄 [광고], 영상 첫 화면에 ‘광고’ 표시(대가가 있는 홍보라서 법으로 꼭 밝혀야 해요). 5 6개월 혜택이 끝날 때까지 지우거나 숨기지 않기(비공개 전환, 공동 작업에서 빼기도 안 돼요). 못 채워도 괜찮아요: 불이익 없이 100% 기간이 3개월로 끝나요. 중간에 지우면 확인된 날부터 50%, 이미 받은 인세는 그대로예요."></li>
<li><img src="card-05.webp?v=20261012" width="1080" height="1350" loading="lazy" decoding="async" alt="5/9 독점 루트는 1년 동안 7:3. 100% 기간 뒤, 뚜르제이에서만 파는 루트는 인세 70%. 1 루트마다 ‘독점’을 고를 수 있어요(고른 다음 날 결제분부터 적용). 2 독점은 그 루트를 다른 곳에서 돈 받고 팔지 않는 것(다른 앱·사이트·전자책·DM 판매 모두 해당). 3 무료 소개와 다른 여행은 자유(같은 여행을 인스타·블로그에 무료로 올려도 돼요). 4 해제는 언제든(다음 날부터 50%, 해제한 루트는 다시 독점으로 못 바꿔요). 5 어기면 독점 보너스가 끝나요(확인된 날부터 모든 루트에 적용, 이미 받은 인세는 그대로). 1년 보장: 보장 기간엔 비율을 낮추지 않고, 그 뒤 바꿀 땐 30일 전에 알려요. 얼리 크리에이터만: 오픈 전 초대받은 분만 받는 혜택이에요."></li>
<li><img src="card-06.webp?v=20261012" width="1080" height="1350" loading="lazy" decoding="async" alt="6/9 매달 정산하고 두 달 뒤 15일에 보내요. 예시: 12월 판매, 1월 1일 지난달 판매분 마감, 2월 15일 입금. 15일이 은행 휴무일이면 다음 영업일에 보내요. 1만원이 안 되면 다음 달로 넘겨 합쳐서 보내고, 12월 지급분은 남은 금액을 모두 보내요. 환불되면 그 판매의 인세는 빠져요. 앱 ‘받을 인세’에서 루트별·날짜별 판매 건수와 예상 인세를 볼 수 있어요. 인세를 받으려면 정산정보(실명·주민등록번호·본인 명의 국내 계좌)를 등록해 주세요. 앱에서 암호화해 보내고, 인세 지급과 세금 신고에만 써요."></li>
<li><img src="card-07.webp?v=20261012" width="1080" height="1350" loading="lazy" decoding="async" alt="7/9 세금은 떼고 보내요. 뚜르제이가 세금을 떼어 대신 신고·납부해요(원천징수). 기타소득(기본) 8.8%: 한 번에 받는 금액이 12만5천원 이하면 0원. 사업소득 3.3%: 금액과 상관없이. 해외 거주자 22%: 조세조약 세율을 신청할 수 있어요. 어느 쪽인지는 정산정보 등록 때 질문 몇 개로 정해져요. 예) 19,900원 루트가 한 달에 10건 팔리면(100% 기간) 인세 153,770원에서 세금 13,530원을 빼고 140,240원 입금. 기타소득 기준이고, 8건(123,016원)이면 세금 0원이에요. 종합소득세 신고 등 남은 납세는 본인이 해요. 부가세 사업자(일반·간이과세자)라면 지급 방법을 따로 안내해요. 지금 법령 기준이에요. 법령이 바뀌면 바뀐 기준을 따라요."></li>
<li><img src="card-08.webp?v=20261012" width="1080" height="1350" loading="lazy" decoding="async" alt="8/9 꼭 지켜 주세요. 어기면 판매 중지·인세 보류 같은 조치가 있을 수 있어요. 직접 다녀온 여행만(날짜·장소·방문 사실을 꾸미면 안 돼요). 글·사진은 직접 쓰고 찍은 것만(쓸 권리가 있는 것도 괜찮아요). 다른 사람 얼굴은 동의받거나 가리기(알아볼 수 없게 처리하면 돼요). 연락처·외부 링크·앱 밖 거래 금지(프로필에 내 인스타 계정 연결은 괜찮아요). 협찬·할인 받은 곳은 밝히기(소개나 ‘왜 여기?’에 분명히 적어 주세요). 루트 내용의 책임은 크리에이터에게 있어요. 이를 어겨 다른 사람이 권리를 주장하면 크리에이터는 자기 비용으로 해결에 협조하고, 뚜르제이가 입은 손해를 배상해요(뚜르제이 잘못으로 생긴 부분은 제외)."></li>
<li><img src="card-09.webp?v=20261012" width="1080" height="1350" loading="lazy" decoding="async" alt="9/9 알아두세요. 판매 중인 루트의 사진·릴스·소개는 뚜르제이 홍보(앱·웹·SNS·광고)에 대가 없이 쓰여요. 닉네임·인스타를 함께 표시하고, 모든 날 일정을 통째로 공개하진 않아요. 판매 중인 루트는 웹에 공개되고, 검색에 나올 수 있어요. 루트에 붙는 상품 링크(마이리얼트립) 수수료는 뚜르제이 몫이에요. 판매는 언제든 멈출 수 있어요. 이미 산 사람은 계속 볼 수 있어요. 만 19세 이상만 참여할 수 있어요. 시작하기: 1 앱 설치·로그인, 2 친구 코드 DM으로 보내기, 3 다녀온 여행 루트로 등록, 4 정산정보 등록, 5 오픈 후 60일 릴스 2개."></li>
</ol>
